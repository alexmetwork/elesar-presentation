function possibleDuplicate(a,b){let x=normName(a).split(' '),y=normName(b).split(' ');return x.length>1&&y.length>1&&x[x.length-1]===y[y.length-1]&&x[0][0]===y[0][0]}
function isStaffName(s){let n=normName(s);return n.split(' ').length>=2&&!roleLabels.has(n)&&!['менеджер ','инженер ','руководитель ','технический '].some(x=>n.startsWith(x))}

function canonicalName(name){return state.people.find(x=>normName(x)===normName(name))||state.people.find(x=>possibleDuplicate(x,name))||''}

function dateISO(v){
 if(!v||typeof v!=='string')return '';
 const s=v.trim();
 if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
   const [y,m,d]=s.split('-').map(Number),dt=new Date(y,m-1,d);
   return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?s:'';
 }
 const m=s.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?\.?$/);
 if(!m)return '';
 const day=Number(m[1]),month=Number(m[2]),year=m[3]?Number(m[3]):2026;
 const dt=new Date(year,month-1,day);
 if(dt.getFullYear()!==year||dt.getMonth()!==month-1||dt.getDate()!==day)return '';
 return String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function dateDisplay(v){
 const iso=dateISO(v);
 if(!iso)return 'Не назначена';
 const [year,month,day]=iso.split('-');
 return day+'.'+month+'.'+year;
}

}

ммуникаций.</p></div></div><div class="drawer-bottom"><button class="btn" data-action="copy" data-id="${p.id}">${svg('file')} Копировать сводку</button><button class="btn primary" data-action="edit" data-id="${p.id}">Редактировать</button><button class="btn" data-action="close-drawer">Закрыть</button></div>`;drawer.classList.add('open');syncOverlay()}
function syncOverlay(){document.getElementById('overlay').classList.toggle('open',state.drawerId!=null||state.modal)}
function openModal(){state.modal=true;modal.innerHTML=`<h2>Новый проект</h2><p>Изменения сохраняются локально в этом браузере.</p><form id="new-form"><div class="fields"><div class="field full"><label>Название проекта *</label><input name="name" required autofocus placeholder="Название проекта" maxlength="130"></div><div class="field"><label>Направление</label><select name="direction"><option value="hatanga" ${state.scope==='hatanga'?'selected':''}>Хатанга</option><option value="components" ${state.scope==='components'?'selected':''}>Внедрение компонентов</option></select></div><div class="field"><label>Организация *</label><input name="company" required maxlength="100" placeholder="Заказчик"></div>${peopleField('Ответственный за проект','owner')}${dateField()}${ballFields()}<div class="field full"><label>Следующий шаг</label><textarea name="focus" placeholder="Что должно произойти дальше?"></textarea></div><div class="field full"><label>Препятствия</label><textarea name="blocker" placeholder="Что мешает, если есть?"></textarea></div><div class="field full"><label>Краткая суть проекта</label><textarea name="summary"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Создать проект</button></div></form>`;modal.classList.add('open');syncOverlay();setTimeout(()=>modal.querySelector('[name=name]')?.focus(),40)}

function editModal(id){const p=state.projects.find(x=>x.id===id);if(!p)return;state.modal=true;
modal.innerHTML=`<h2>Изменить проект</h2><p>Прототип v2.1. Изменения сохраняются локально.</p><form id="edit-form"><input type="hidden" name="id" value="${p.id}"><div class="fields"><div class="field full"><label>Название</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Этап</label><select name="stage">${[p.stage,...['Переговоры','Техническая проработка','Ожидание заказчика','Образцы и проверка','Согласование','Пилот','Реализация','Завершён'].filter(x=>x!==p.stage)].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Состояние</label><select name="priority"><option value="normal" ${p.priority==='normal'?'selected':''}>В работе</option><option value="attention" ${p.priority==='attention'?'selected':''}>Нужно внимание</option><option value="approval" ${p.priority==='approval'?'selected':''}>Нужно согласование</option></select></div>${peopleField('Ответственный за проект','owner',p.owner)}${dateField(p.review)}${ballFields(p.ballSide||'',p.ballPerson||'')}<div class="field full"><label>Следующий шаг</label><textarea name="focus">${esc(p.focus)}</textarea></div><div class="field full"><label>Препятствия</label><textarea name="blocker">${esc(p.blocker)}</textarea></div><div class="field full"><label>Краткое описание</label><textarea name="summary">${esc(p.summary)}</textarea></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Сохранить изменения</button></div></form>`;
modal.classList.add('open');syncOverlay()}
function closeAll(){state.modal=false;state.drawerId=null;modal.classList.remove('open');drawer.classList.remove('open');state.notifications=false;document.getElementById('notifications').classList.remove('open');syncOverlay()}
let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
function exporter(){let payload={note:'Демонстрационные данные прототипа, не рабочая база',exported_at:new Date().toISOString(),projects:state.projects,approvals:state.approvals,people:state.people};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-hub-demo-export.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Демоданные выгружены в JSON')}
function notify(){state.notifications=!state.notifications;let box=document.getElementById('notifications');box.classList.toggle('open',state.notifications);box.innerHTML=`<div class="notif-title">Уведомления · демо</div>${pending().map(a=>`<div class="notif-item"><b>${svg('approve')} Ожидает согласования</b>${esc(a.title)}</div>`).join('')||'<div class="notif-item">Нет ожидающих согласований.</div>'}<div class="notif-item" style="color:#7d879a">Email и другие каналы будут подключаться позже.</div>`}
document.addEventListener('click',function(e){const target=e.target.closest('[data-action]');if(!target){if(state.notifications&&!e.target.closest('#notifications')){state.notifications=false;document.getElementById('notifications').classList.remove('open')}return}if(target.matches('a'))e.preventDefault();let action=target.dataset.action;
switch(action){case'page':go(target.dataset.page);break;case'scope':state.scope=target.dataset.scope;state.query='';state.priority='all';if(state.page==='settings')state.page='overview';render();break;case'open':state.drawerId=Number(target.dataset.id);renderDrawer();break;case'close-drawer':state.drawerId=null;renderDrawer();break;case'close-modal':state.modal=false;modal.classList.remove('open');syncOverlay();break;case'close-all':closeAll();break;case'new':openModal();break;case'edit':editModal(Number(target.dataset.id));break;case'calendar':{const input=modal.querySelector('[name=review]');if(input){try{input.showPicker?.()}catch(e){input.focus()}}break;}case'edit-staff':{let b=document.querySelector('[data-staff-rename="'+target.dataset.name+'"]');if(b){b.hidden=false;b.querySelector('input')?.focus()}break;}case'cancel-staff-rename':{let b=document.querySelector('[data-staff-rename="'+target.dataset.name+'"]');if(b)b.hidden=true;break;}case'save-staff-rename':{let old=target.dataset.name,b=document.querySelector('[data-staff-rename="'+old+'"]'),name=b?.querySelector('input')?.value.trim().replace(/\s+/g,' ');if(!isStaffName(name)){toast('Укажи имя и фамилию');break;}let match=state.people.find(x=>x!==old&&(normName(x)===normName(name)||possibleDuplicate(x,name)));if(match){toast('Возможно, уже есть: '+match);break;}state.people=state.people.map(x=>x===old?name:x).sort((a,b)=>a.localeCompare(b,'ru'));for(const p of state.projects){if(p.owner===old)p.owner=name;if(p.ballSide==='internal'&&p.ballPerson===old)p.ballPerson=name}save();render();toast('Имя обновлено во всех проектах');break;}case'remove-staff':{let name=target.dataset.name;if(staffCount(name)>0){toast('Сначала переназначь проекты');break;}if(!confirm('Удалить из справочника: '+name+'?'))break;state.people=state.people.filter(x=>x!==name);save();render();toast('Сотрудник удалён');break;}case'view':state.view=target.dataset.view;render();break;case'decide':{let a=state.approvals.find(a=>a.id===Number(target.dataset.id));if(a){a.status=target.dataset.result;save();render();toast(a.status==='approved'?'Решение подтверждено (демо)':'Возвращено на доработку (демо)')}break;}case'export':exporter();break;case'copy':{let p=state.projects.find(p=>p.id===Number(target.dataset.id));if(p){let txt=`${p.name}\nЗаказчик: ${p.company}\nНаправление: ${dn[p.direction]}\nЭтап: ${p.stage}\nОтветственный: ${p.owner}\nУ кого мяч: ${ballLabel(p)}\nСледующий шаг: ${p.focus}\nКонтроль: ${dateDisplay(p.review)}`;navigator.clipboard?.writeText(txt).then(()=>toast('Сводка скопирована')).catch(()=>toast('Копирование недоступно в этом браузере'));}break;}case'notifications':notify();break;}
});
document.addEventListener('input',e=>{if(e.target.id==='project-search'){let pos=e.target.selectionStart;state.query=e.target.value;const view=state.view;let block=document.querySelector('.panel')||document.querySelector('.board');const items=filteredProjects();let projectPanel=document.querySelector('.page > .panel');if(projectPanel){projectPanel.innerHTML=table(items)}else if(view==='board'){let boardEl=document.querySelector('.board');if(boardEl)boardEl.outerHTML=board(items)}let counter=document.querySelector('.section-heading .count');if(counter)counter.textContent=items.length;try{e.target.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',e=>{if(e.target.id==='priority'){state.priority=e.target.value;render();}if(e.target.matches('[data-ball-side]')){let slot=modal.querySelector('#ball-person');if(slot)slot.outerHTML=ballPersonField(e.target.value,'');}});
document.addEventListener('submit',e=>{if(e.target.id==='staff-form'){e.preventDefault();let name=new FormData(e.target).get('staffName');addStaff(name);return;}if(e.target.id==='edit-form'){e.preventDefault();let f=new FormData(e.target),p=state.projects.find(x=>x.id===Number(f.get('id')));if(!p)return;for(let k of ['name','stage','priority','owner','review','focus','blocker','summary'])p[k]=String(f.get(k)||'').trim();p.review=dateISO(p.review);p.owner=p.owner||'Не назначен';p.ballSide=String(f.get('ballSide')||'');p.ballPerson=String(f.get('ballPerson')||'').trim();p.updated=new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});p.events.unshift([p.updated,'Обновлена карточка проекта','Ведущий']);if(!save())return;closeAll();render();toast('Изменения сохранены. Проверена запись в браузер.');return;}if(e.target.id!=='new-form')return;e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),company=String(f.get('company')||'').trim();if(!name||!company)return;let dir=String(f.get('direction')||'hatanga');let p={id:Date.now(),name,direction:dir,company,owner:String(f.get('owner')||'Не назначен').trim()||'Не назначен',ballSide:String(f.get('ballSide')||''),ballPerson:String(f.get('ballPerson')||'').trim(),engineer:'Не назначен',stage:'Переговоры',focus:String(f.get('focus')||'').trim()||'Уточнить следующий шаг по проекту',review:dateISO(String(f.get('review')||'')),updated:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),priority:'normal',value:'Не оценён',product:dir==='hatanga'?'Хатанга':'Не указан',summary:String(f.get('summary')||'').trim()||'Описание пока не добавлено.',blocker:String(f.get('blocker')||'').trim()||'Препятствия пока не обозначены.',events:[['Сегодня','Проект создан','Владелец']]};state.projects.unshift(p);if(!save()){state.projects.shift();return;}closeAll();state.scope='all';state.page='projects';render();toast('Демонстрационный проект добавлен локально')});
document.addEventListener('input',e=>{if(e.target.matches('[data-review]')){try{localStorage.setItem('project-hub-review-v2-'+e.target.dataset.review,e.target.value)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
render();
})();
</script>
</body></html>
