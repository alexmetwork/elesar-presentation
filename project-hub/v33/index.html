function info(project){
 let qs=questions(project.id),ans=qs.filter(x=>x.status==='answered'),wait=qs.filter(x=>x.status==='waiting');
 if(project.approval&&project.approval.status==='pending')return {category:'leader',label:'Нужно решение Павла',detail:project.approval.title,owner:'Павел',due:project.next.due,tone:'warn'};
 if(ans.length)return {category:'manager',label:'Ответ ждёт обработки',detail:ans[0].title,owner:'Сергей',due:'',tone:'purple'};
 if(wait.length){wait.sort((a,b)=>a.due.localeCompare(b.due));let x=wait[0];return {category:'moscow',label:overdue(x.due)?'Москва просрочила ответ':'Ожидаем Москву',detail:x.title,owner:'Москва',due:x.due,tone:overdue(x.due)?'red':'warn'} }
 if(!project.next.title||!project.next.due||!project.next.owner)return {category:'none',label:'Нет следующего контроля',detail:'Требуется назначить действие, ответственного и срок',owner:'Не назначен',due:'',tone:'red'};
 return {category:project.next.owner,label:project.next.owner==='customer'?'Ожидаем заказчика':project.next.owner==='leader'?'Нужно решение Павла':'Следующий шаг определён',detail:project.next.title,owner:owner(project.next.owner),due:project.next.due,tone:overdue(project.next.due)?'red':project.next.owner==='manager'?'green':'warn'};
}
function tag(text,tone){return '<span class="tag '+(tone||'')+'">'+esc(text)+'</span>'}
function btn(text,act,attrs,kind){return '<button class="btn '+(kind||'')+'" type="button" data-action="'+act+'" '+(attrs||'')+'>'+esc(text)+'</button>'}
function box(title,desc,body,action){return '<section class="section"><div class="sectionhead"><div><h2>'+esc(title)+'</h2><p>'+esc(desc||'')+'</p></div>'+(action||'')+'</div>'+body+'</section>'}
function metric(name,n,detail){return '<div class="stat"><small>'+esc(name)+'</small><strong>'+n+'</strong><em>'+esc(detail)+'</em></div>'}
function field(label,name,type,val,placeholder,extra){return '<div class="field"><label>'+esc(label)+'</label>'+(type==='textarea'?'<textarea name="'+esc(name)+'" placeholder="'+esc(placeholder||'')+'" '+(extra||'')+'>'+esc(val||'')+'</textarea>':'<input name="'+esc(name)+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" placeholder="'+esc(placeholder||'')+'" '+(extra||'')+'>')+'</div>'}
function get(f,n){return String(new FormData(f).get(n)||'').trim()}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.handle);toast.handle=setTimeout(()=>el.classList.remove('show'),2800)}
function navigate(pageName){page=pageName;render();window.scrollTo(0,0)}
function setRole(r){if(!ROLES[r])return;role=r;page='main';filter='all';render();window.scrollTo(0,0)}
function projectSelected(id){if(!p(id))return;selected=id;page='project';render();window.scrollTo(0,0)}
function stages(project){return '<div class="progress-strip">'+PHASES.map((s,i)=>'<div class="step '+(i<project.stage?'done':i===project.stage?'current':'')+'"><div></div><small>'+esc(s)+'</small></div>').join('')+'</div>'}
function projectInfo(project){
 let s=info(project);
 return '<div class="panel pad section"><div class="cardhead"><div><div class="eyebrow">'+esc(project.client)+'</div><h2 style="font-size:18px">'+esc(project.name)+'</h2><p class="subtitle">'+esc(project.summary)+'</p></div>'+tag(s.label,s.tone)+'</div>'+stages(project)+
 '<div class="summarygrid"><div>Этап<b>'+esc(stage(project))+'</b></div><div>Чей мяч<b>'+esc(s.owner)+'</b></div><div>Контроль<b>'+esc(date(s.due))+'</b></div><div>Менеджер<b>Сергей</b></div></div><div class="line"></div><div class="factlabel">Что препятствует продвижению</div><p class="helptext">'+esc(project.blocker)+'</p></div>';
}
function feed(pid,limit){
 let ev=data.events.filter(e=>!pid||e.pid===pid).slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,limit||30);
 return '<div class="panel pad">'+(ev.length?ev.map(e=>'<div class="record"><div class="recorddate">'+esc(dt(e.at))+'</div><div class="recordtext"><strong>'+esc(e.title)+'</strong><p>'+esc(e.details)+'</p><small>'+esc(e.actor)+' · '+esc(p(e.pid)?.client||'')+'</small></div></div>').join(''):'<div class="empty">Записей пока нет.</div>')+'</div>';
}
function filters(){
 let variants=[['all','Все'],['problems','Проблемы'],['overdue','Просрочки'],['leader','Павел'],['moscow','Москва'],['manager','Сергей']];
 return '<div class="screen-actions">'+variants.map(a=>'<button class="filter '+(filter===a[0]?'active':'')+'" data-action="filter" data-value="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
}
function listFilter(project){
 let x=info(project);
 if(filter==='all')return true;
 if(filter==='leader')return x.category==='leader';
 if(filter==='moscow')return x.category==='moscow';
 if(filter==='manager')return x.category==='manager'||x.category==='customer'||x.category==='none';
 if(filter==='overdue')return !!x.due&&overdue(x.due);
 return x.tone==='red'||x.category==='leader'||x.category==='none'||x.category==='manager'&&questions(project.id).some(q=>q.status==='answered');
}

 '<div class="two" style="margin-top:20px"><div>'+box('Требуют решения Павла','Одобри условия пилота или запроси уточнения.',
 data.projects.filter(x=>x.approval?.status==='pending').map(x=>'<div class="card soft"><div class="cardhead"><h3>'+esc(x.client)+' - '+esc(x.approval.title)+'</h3>'+tag('Решение Павла','warn')+'</div><p>'+esc(x.approval.request)+'</p><div class="buttons">'+btn('Открыть и принять решение','open','data-id="'+esc(x.id)+'"','primary small')+'</div></div>').join('')||'<div class="panel empty">Нет запросов.</div>')+

function questionCard(item){
 let project=p(item.pid),status=item.status;
 let body='<div class="qa"><div class="qa-head"><div class="qa-title">'+esc(item.title)+'</div>'+tag(status==='waiting'?overdue(item.due)?'Просрочен':'Ожидает ответа':status==='answered'?'Ответ получен':'Обработан',status==='waiting'?(overdue(item.due)?'red':'warn'):status==='answered'?'purple':'green')+'</div>'+
 '<p>'+esc(item.details||'')+'</p><div class="qa-meta">'+esc(project?.client||'')+' · Контроль '+esc(date(item.due))+'</div>';
 if(status==='waiting'&&role==='moscow')body+='<form class="form" data-form="reply" data-id="'+esc(item.id)+'">'+field('Ваш ответ *','answer','textarea','','Кратко: что известно, ограничения, следующий ориентир','required maxlength="2500"')+'<div class="hint">Ответ сохранится в истории, Сергей получит уведомление.</div><button class="btn primary" type="submit">Отправить ответ</button></form>';
 if(status==='waiting'&&role==='manager')body+='<div class="buttons">'+btn('Напомнить Москве','remind','data-id="'+esc(item.id)+'"','small')+'</div>';
 if(status==='answered'){body+='<div class="line"></div><div class="factlabel">Ответ Москвы</div><p>'+esc(item.answer)+'</p>';
 if(role==='manager')body+='<form class="form" data-form="close" data-id="'+esc(item.id)+'">'+field('Следующее действие *','next','text','','Например: согласовать выезд','required maxlength="230"')+
 '<div class="two-column">'+field('Дата контроля *','due','date',day(3),'','required')+'</div>'+
 '<div class="hint">Закрываем ответ и фиксируем следующий шаг менеджера.</div><button class="btn primary" type="submit">Принять ответ и назначить контроль</button></form>';
 }
 if(role==='leader'&&status==='waiting')body+='<div class="buttons">'+btn('Напомнить Сергею о контроле','leader-remind','data-id="'+esc(item.id)+'"','small')+'</div>';
 body+='</div>';return body;
}

 return '<div class="card"><h3>Как показывать Павлу</h3><p>1. На вкладке «Обзор» посмотри все семь проектов. 2. Выбери фильтр «Павел» и согласуй условия пилота. 3. Переключись на «Москва» и ответь на один из вопросов. 4. Переключись на «Сергей» и обработай ответ. 5. Вернись на «Павел»: состояние изменится для всех.</p></div>'+
 '<div class="card"><h3>Технические границы</h3><p>Роли переключаются без авторизации. Это единый локальный сценарий, не серверное приложение. Сведения и заказчики вымышленные. Email не отправляется, все изменения сохраняются только в браузере. В будущем нужны серверная база, авторизация, разграничение доступа и почтовые напоминания.</p></div>'+
 '<div class="card"><h3>Демонстрационные данные v3.3</h3><p>v3.3 независима от v3.2 и других версий. Можно сбросить демонстрацию для Павла, экспортировать или импортировать данные в JSON.</p><div class="buttons">'+btn('Экспорт JSON','export','','small')+btn('Импорт JSON','import','','small')+btn('Вернуть исходные 7 проектов','reset','','small warn')+'</div></div><input id="import-file" type="file" accept=".json,application/json" hidden>';
}
function render(){
 let nav=[['main','◫','Обзор'],['history','◷','История'],['mail','✉','Письма'],['settings','⚙','Настройки']];
 document.getElementById('roles').innerHTML=Object.keys(ROLES).map(r=>'<button class="role '+(role===r?'active':'')+'" type="button" data-action="role" data-role="'+r+'" aria-pressed="'+(role===r?'true':'false')+'"><b>'+ROLES[r]+'</b><small>'+({leader:'Руководитель',manager:'Менеджер',moscow:'Исполнитель'}[r])+'</small></button>').join('');
 document.getElementById('nav').innerHTML=nav.map(n=>'<button type="button" class="'+(page===n[0]?'active':'')+'" data-action="page" data-page="'+n[0]+'"><span class="navicon">'+n[1]+'</span>'+n[2]+'</button>').join('');
 let titles={leader:['Общий контроль','Семь проектов, разные зоны ответственности. Где проблемы и что делать?'],manager:['Мои проекты','Мои действия, ответы на вопросы и следующие сроки контроля.'],moscow:['Мои запросы','Только нужные от меня ответы по проектам.']};
 let h=page==='main'?titles[role]:page==='project'?[p(selected)?.name||'Проект','Подробности, история и действия для выбранной роли.']:{history:['История','Все изменения по семи проектам.'],mail:['Письма','Демонстрационные уведомления без реальной отправки.'],settings:['Настройки','Как проверить сценарии и сбросить данные.']}[page];
 document.getElementById('heading').textContent=h[0];document.getElementById('subtitle').textContent=h[1];
 document.getElementById('crumb').textContent=ROLES[role]+' / '+(page==='project'?p(selected)?.client||'Проект':page==='main'?'Обзор':nav.find(n=>n[0]===page)?.[2]||page);
 document.getElementById('body').innerHTML=page==='main'?(role==='leader'?leader():role==='manager'?manager():moscow()):page==='project'?projectPage():page==='history'?history():page==='mail'?mailbox():settings();
}
function ask(f){
 if(role!=='manager')return;let project=p(f.dataset.pid),title=get(f,'title'),due=get(f,'due'),details=get(f,'details');
 if(!project||!title||!due)return toast('Укажи вопрос и дату контроля.');
 let ok=tx(()=>{
  let item={id:id('q'),pid:project.id,title,details,due,status:'waiting',answer:'',created:now(),answered:'',closed:''};
  data.questions.push(item);project.next={title,owner:'moscow',due};
  rec(project.id,'Сергей','Вопрос направлен Москве',title+'\nКонтроль: '+date(due));
  mail(project.id,'Москва','Новый вопрос: '+project.client,title+(details?'\n'+details:'')+'\nОтвет до '+date(due),'Запрос');
 });if(ok){render();toast('Вопрос добавлен. У Москвы появился новый запрос.')}
}
function reply(f){
 if(role!=='moscow')return;let item=q(f.dataset.id),text=get(f,'answer');
 if(!item||item.status!=='waiting'||!text)return toast('Нужен ответ на открытый вопрос.');
 let ok=tx(()=>{
  item.answer=text;item.answered=now();item.status='answered';
  rec(item.pid,'Москва','Получен технический ответ',item.title+'\n'+text);
  mail(item.pid,'Сергей','Ответ по '+p(item.pid).client,item.title+'\n'+text,'Ответ');
 });if(ok){render();toast('Ответ сохранён. Сергей увидит задачу на обработку.')}
}
function close(f){
 if(role!=='manager')return;let item=q(f.dataset.id),next=get(f,'next'),due=get(f,'due');
 if(!item||item.status!=='answered'||!next||!due)return toast('Нужно указать следующий шаг и дату.');
 let ok=tx(()=>{
  item.status='closed';item.closed=now();p(item.pid).next={title:next,owner:'manager',due};
  rec(item.pid,'Сергей','Ответ обработан, следующий контроль назначен',item.title+'\nСледующий шаг: '+next+'\nСрок: '+date(due));
  mail(item.pid,'Павел','Проект обновлён: '+p(item.pid).client,'Следующий шаг: '+next+'\nКонтроль: '+date(due),'Результат');
 });if(ok){render();toast('Ответ обработан. Павел увидит следующий шаг.')}
}
function update(f){
 if(role!=='manager')return;let project=p(f.dataset.pid),note=get(f,'note'),next=get(f,'next'),due=get(f,'due'),newOwner=get(f,'owner');
 if(!project||!note||!next||!due||!['manager','moscow','customer','leader'].includes(newOwner))return toast('Заполни факт, следующий шаг и контроль.');
 let old=project.next;let ok=tx(()=>{
  project.next={title:next,owner:newOwner,due};
  rec(project.id,'Сергей','Обновлено состояние проекта',note+'\nБыло: '+(old.title||'не определено')+'; срок: '+date(old.due)+'\nСледующее действие: '+next+'; чей мяч: '+owner(newOwner)+'; срок: '+date(due));
  mail(project.id,'Павел','Обновление проекта: '+project.client,note+'\nСледующее действие: '+next+'\nКонтроль: '+date(due),'Обновление');
 });if(ok){render();toast('Состояние и история обновлены.')}
}
function approve(f,eventDecision){
 if(role!=='leader')return;let project=p(f.dataset.pid),note=get(f,'note'),decision=eventDecision;
 if(!project||!project.approval||project.approval.status!=='pending'||!['approved','rejected'].includes(decision))return;
 if(decision==='rejected'&&!note)return toast('Укажи причину отказа.');
 let ok=tx(()=>{
  project.approval.status=decision;project.approval.note=note;
  project.next={title:decision==='approved'?'Подтвердить согласованные условия заказчику':'Пересмотреть условия и представить на новое согласование',owner:'manager',due:day(3)};
  project.blocker=decision==='approved'?'Ожидаем реакцию заказчика на согласованные условия.':'Условия требуют переработки.';
  rec(project.id,'Павел',decision==='approved'?'Пилот согласован':'Пилот не согласован',note||'Решение принято без дополнительного комментария');
  mail(project.id,'Сергей','Решение Павла: '+project.client,(decision==='approved'?'Согласовано. ':'Отклонено. ')+(note||'')+'\nСледующий шаг: '+project.next.title,'Решение');
 });if(ok){render();toast('Решение сохранено. Сергей получил следующую задачу.')}
}
function remind(itemId,byLeader){
 let item=q(itemId);if(!item)return;
 let to=byLeader?'Сергей':'Москва',source=byLeader?'Павел':'Сергей',project=p(item.pid);
 let ok=tx(()=>{rec(item.pid,source,'Сформировано напоминание для '+to,item.title);mail(item.pid,to,'Напоминание: '+project.client,item.title+'\nКонтроль: '+date(item.due),'Напоминание')});
 if(ok){render();toast('Напоминание записано в журнал. Email не отправлен.')}
}
function remindProject(pid){
 let project=p(pid);if(!project)return;
 let ok=tx(()=>{rec(pid,'Павел','Запрошено уточнение у Сергея',project.next.title||'Нет следующего контроля');mail(pid,'Сергей','Уточнить состояние проекта '+project.client,project.next.title||'Назначить следующее действие и контрольную дату','Напоминание')});
 if(ok){render();toast('Запрос руководителя записан в журнал.')}
}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hatanga-v33-'+day()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),300)}
document.addEventListener('click',e=>{
 let b=e.target.closest('[data-action]');if(!b)return;
 let act=b.dataset.action;
 if(act==='page'){navigate(b.dataset.page);return}
 if(act==='open'){projectSelected(b.dataset.id);return}
 if(act==='back'){navigate('main');return}
 if(act==='role'){setRole(b.dataset.role);return}
 if(act==='filter'){filter=b.dataset.value;render();return}
 if(act==='remind'&&role==='manager'){remind(b.dataset.id,false);return}
 if(act==='leader-remind'&&role==='leader'){remind(b.dataset.id,true);return}
 if(act==='leader-project-remind'&&role==='leader'){remindProject(b.dataset.pid);return}
 if(act==='export'){exportData();return}
 if(act==='import'){document.getElementById('import-file').click();return}
 if(act==='reset'){if(!confirm('Восстановить семь исходных демопроектов? Все локальные изменения v3.3 будут потеряны.'))return;data=seed();save();selected='p1';setRole('leader');toast('Демонстрация сброшена.');return}
});
document.addEventListener('submit',e=>{
 let f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();
 if(f.dataset.form==='ask')ask(f);
 if(f.dataset.form==='reply')reply(f);
 if(f.dataset.form==='close')close(f);
 if(f.dataset.form==='update')update(f);
 if(f.dataset.form==='decision')approve(f,e.submitter?.value||'');
});
document.addEventListener('change',e=>{
 if(e.target.id!=='import-file')return;let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();
 reader.onload=()=>{try{let incoming=JSON.parse(reader.result);if(!valid(incoming))throw Error('Неподходящий файл v3.3');if(!confirm('Заменить текущие данные v3.3 содержимым файла?'))return;let prior=data;data=incoming;if(!save()){data=prior;return}render();toast('Импорт завершён')}catch(error){alert('Ошибка импорта: '+error.message)}finally{e.target.value=''}};
 reader.readAsText(file);
});
render();
})();
</script></body></html>
