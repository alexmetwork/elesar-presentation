function client(id){return state.clients.find(function(c){return c.id===id})}
function project(id){return state.projects.find(function(p){return p.id===id})}
function task(id){return state.tasks.find(function(t){return t.id===id})}
function projectTasks(pid){return state.tasks.filter(function(t){return t.projectId===pid})}
function openTasks(pid){return projectTasks(pid).filter(function(t){return t.status!=='done'})}
function activeProjects(){return state.projects.filter(function(p){return p.stageIndex<(p.stages||[]).length-1})}
function clientProjects(cid){return state.projects.filter(function(p){return p.clientId===cid})}
function taskOverdue(t){return t.status!=='done'&&!!t.due&&t.due<addDays(0)}
function taskToday(t){return t.status!=='done'&&t.due===addDays(0)}
function taskUndated(t){return t.status!=='done'&&!t.due}
function taskBlocked(t){return t.dependsOn&&task(t.dependsOn)&&task(t.dependsOn).status!=='done'}

function submitDiary(form){
 var projectId=formValue(form,'projectId'),p=project(projectId),body=formValue(form,'entry'),mode=formValue(form,'mode');
 if(!p)return diaryError('Выбери проект.');
 if(!body)return diaryError('Запиши, что произошло.');
 if(body.length>3000)return diaryError('Слишком длинная запись.');
 var patch=null,created=null,logTail='',linkedTaskId='';
 if(mode==='create'){
   var title=formValue(form,'taskTitle'),date=parseDate(formValue(form,'taskDue')),status=formValue(form,'taskStatus');
   if(!title)return diaryError('Напиши название следующей задачи.');
   if(date===null)return diaryError('Проверь контрольную дату.');
   if(!STATUS[status])return diaryError('Проверь состояние задачи.');
   created={id:null,projectId:projectId,parentId:null,title:title,assignee:formValue(form,'taskAssignee'),due:date,status:status,waitingOn:formValue(form,'taskWaitingOn'),dependsOn:'',details:''};
   logTail='\nНовая задача: '+title+'. Контроль: '+dateRu(date)+'. Ответственный: '+(created.assignee||'не назначен')+'.';
 }else if(mode==='update'){
   var t=task(formValue(form,'existingTaskId')),dueText=formValue(form,'existingDue'),parsed=dueText?parseDate(dueText):null,st=formValue(form,'existingStatus');
   if(!t||t.projectId!==projectId||t.status==='done')return diaryError('Выбери открытую задачу.');
   if(dueText&&parsed===null)return diaryError('Проверь новую дату.');
   if(st!=='same'&&!STATUS[st])return diaryError('Проверь состояние.');
   var due=dueText?parsed:t.due,newStatus=st==='same'?t.status:st;
   if(due===t.due&&newStatus===t.status)return diaryError('Укажи, что изменилось: срок или состояние. Для простой записи выбери первый вариант.');
   patch={task:t,due:due,status:newStatus,oldDue:t.due,oldStatus:t.status};
   linkedTaskId=t.id;
   logTail='\nОбновлена задача: '+t.title+'.'+(t.due!==due?' Срок: '+dateRu(t.due)+' -> '+dateRu(due)+'.':'')+(t.status!==newStatus?' Статус: '+STATUS[t.status]+' -> '+STATUS[newStatus]+'.':'');
 }else if(mode!=='note')return diaryError('Выбери действие после записи.');
 // Одно сохранение на одно действие. Запись выступает причиной переноса срока.
 var snapshot=JSON.stringify(state);
 if(created){created.id=id('t');state.tasks.push(created);linkedTaskId=created.id}
 if(patch){patch.task.due=patch.due;patch.task.status=patch.status}
 state.events.push({id:id('e'),projectId:projectId,at:now(),title:mode==='create'?'Запись дневника · создана задача':mode==='update'?'Запись дневника · обновлена задача':'Запись в дневнике',description:body+logTail,actor:'Демо-редактор',kind:'diary',linkedTaskId:linkedTaskId});
 if(!save()){state=JSON.parse(snapshot);return diaryError('Не удалось сохранить запись.')}
 view.diaryProjectId=projectId;view.filter='overdue';render();toast('Запись сохранена');
}

 else if(k==='task'){var title=formValue(f,'title'),due=parseDate(formValue(f,'due'));if(!title)return error('Укажите название задачи.');if(due===null)return error('Проверьте дату. Формат: ДД.ММ.ГГГГ.');var pid=x.projectId||t&&t.projectId,other=formValue(f,'dependsOn');if(!project(pid))return error('Проект не найден.');if(t&&due!==t.due&&!formValue(f,'reason'))return error('Укажите причину изменения срока.');if(other&&other===t?.id)return error('Задача не может зависеть от самой себя.');if(other&&t){var cursor=task(other),seen=new Set();while(cursor&&cursor.dependsOn&&!seen.has(cursor.id)){seen.add(cursor.id);if(cursor.dependsOn===t.id)return error('Циклическая зависимость задач недопустима.');cursor=task(cursor.dependsOn)}}
 var values={title:title,assignee:formValue(f,'assignee'),due:due,status:formValue(f,'status'),waitingOn:formValue(f,'waitingOn'),details:formValue(f,'details'),dependsOn:other};
 if(t){var oldDue=t.due,oldStatus=t.status;Object.assign(t,values);event(pid,'Задача изменена: '+title,oldDue!==due?'Контрольный срок: '+dateRu(oldDue)+' -> '+dateRu(due)+'. Причина: '+formValue(f,'reason'):oldStatus!==values.status?'Состояние: '+STATUS[oldStatus]+' -> '+STATUS[values.status]:'Изменены данные задачи','task')}
 else{t=Object.assign({id:id('t'),projectId:pid,parentId:x.parentId||null},values);state.tasks.push(t);event(pid,(x.parentId?'Подзадача создана: ':'Задача создана: ')+title,'Ответственный: '+(t.assignee||'не назначен')+'. Срок: '+dateRu(t.due),'task')}view.page='project';view.projectId=pid;view.tab='tasks';view.expanded[t.id]=true;if(t.parentId)view.expanded[t.parentId]=true;}
 else if(k==='event'){var evTitle=formValue(f,'title');if(!evTitle)return error('Укажите событие.');event(x.projectId,evTitle,formValue(f,'description'),'note');view.page='project';view.projectId=x.projectId;view.tab='history';}
 else if(k==='stage'){var idx=Number(formValue(f,'target')),reason=formValue(f,'reason');if(!p||!Number.isInteger(idx)||idx<0||idx>=p.stages.length)return error('Этап не найден.');if(idx===p.stageIndex)return error('Выбран текущий этап.');var open=openTasks(p.id).length;if(open){if(!reason)return error('При незавершённых задачах укажите причину перехода.');var existing=state.approvals.some(function(a){return a.projectId===p.id&&a.status==='pending'});if(existing)return error('По проекту уже есть незавершённое согласование.');state.approvals.push({id:id('a'),projectId:p.id,target:idx,targetName:p.stages[idx],reason:reason,openCount:open,at:now(),status:'pending'});event(p.id,'Запрошено согласование перехода','На этап: '+p.stages[idx]+'. Открытых задач: '+open+'. '+reason,'approval');toast('Запрос на согласование добавлен')}else transition(p.id,idx,reason);}
 else if(k==='stages'){if(!p)return error('Проект не найден.');var names=formValue(f,'stages').split('\n').map(function(s){return s.trim()}).filter(Boolean);if(!names.length||names.length>25||new Set(names).size!==names.length)return error('Укажите 1-25 разных этапов.');var current=stageName(p);p.stages=names;p.stageIndex=Math.max(0,names.indexOf(current));event(p.id,'Обновлена последовательность этапов',names.join(' -> '),'stage');}
 else if(k==='decision'){var a=state.approvals.find(function(v){return v.id===x.approvalId}),note=formValue(f,'reason');if(!a||a.status!=='pending')return error('Запрос недоступен.');if(x.decision==='rejected'&&!note)return error('Укажите причину отказа.');a.status=x.decision;a.decidedAt=now();a.decisionNote=note;if(a.status==='approved'){var proj=project(a.projectId);if(!proj)return error('Проект недоступен.');var targetName=proj.stages.indexOf(a.targetName);if(targetName<0)return error('Этапы проекта изменились. Создайте запрос заново.');transition(a.projectId,targetName,'Согласовано при '+a.openCount+' незакрытых задачах. '+note)}else event(a.projectId,'Переход на этап отклонён',note,'approval');}
 view.dialog=null;if(save()){render();toast('Сохранено')}else render();
}
function download(){var raw=JSON.stringify(state,null,2),blob=new Blob([raw],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hatanga-v31-backup-'+addDays(0)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},250)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var act=b.dataset.action,mid=b.dataset.id;if(act==='navigate'){navigate(b.dataset.page);return}
 if(act==='dashboard-filter'){view.filter=b.dataset.filter;view.page='overview';render();return}
 if(act==='write-project'){writeProjectNote(mid);return}
 if(act==='open-date'||act==='open-date-text'){openDatePicker(b);return}
 if(act==='overview-task'){openOverviewTask(mid);return}
 if(act==='client'){view.clientId=mid;view.page='client';view.dialog=null;render();window.scrollTo(0,0);return}
 if(act==='project'){view.projectId=mid;view.page='project';view.tab='tasks';view.filter='open';view.targetTask=null;view.dialog=null;render();window.scrollTo(0,0);return}
 if(act==='new-client')return formDialog('client',{});
 if(act==='edit-client')return formDialog('client',{clientId:mid});
 if(act==='new-project'){if(!state.clients.length){toast('Сначала создайте заказчика');return}return formDialog('project',{clientId:b.dataset.client||''})}
 if(act==='edit-project')return formDialog('project',{id:mid});
 if(act==='new-task')return formDialog('task',{projectId:b.dataset.project});
 if(act==='new-subtask'){var t=task(mid);if(t)return formDialog('task',{projectId:t.projectId,parentId:t.id});return}
 if(act==='edit-task')return formDialog('task',{taskId:mid});
 if(act==='new-event')return formDialog('event',{projectId:b.dataset.project});
 if(act==='change-stage')return formDialog('stage',{id:mid});
 if(act==='edit-stages')return formDialog('stages',{id:mid});
 if(act==='close-dialog'){closeDialog();return}
 if(act==='project-tab'){view.tab=b.dataset.tab;render();return}
 if(act==='task-filter'){view.filter=b.dataset.filter;render();return}
 if(act==='expand-task'){view.expanded[mid]=!view.expanded[mid];render();return}
 if(act==='toggle-task'){var tk=task(mid);if(!tk)return;tk.status=tk.status==='done'?'todo':'done';event(tk.projectId,'Состояние задачи: '+tk.title,STATUS[tk.status],'task');save();render();toast('Изменено');return}
 if(act==='decide')return formDialog('decision',{approvalId:mid,decision:b.dataset.decision});
 if(act==='export')return download();
 if(act==='import'){document.getElementById('import-file').click();return}
 if(act==='reset'){if(!confirm('Заменить все локальные данные v3.1 исходной демонстрацией? Рекомендуется сначала экспортировать JSON.'))return;state=seed();save();view.page='overview';view.filter='open';view.expanded={};render();toast('Демо-данные восстановлены');return}
});
document.addEventListener('change',function(e){if(e.target.name==='projectId'||e.target.name==='mode'){var form=e.target.closest('#diary-form');if(form)syncDiaryForm(form)}if(e.target.classList&&e.target.classList.contains('date-picker-native')){var entry=e.target.closest('.date-entry');var visible=entry&&entry.querySelector('.date-text');if(visible)visible.value=e.target.value?dateRu(e.target.value):''}});
document.addEventListener('submit',function(e){if(e.target.id==='editor-form'){e.preventDefault();submitForm(e.target)}else if(e.target.id==='diary-form'){e.preventDefault();submitDiary(e.target)}});
document.getElementById('import-file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(!d||d.version!==3||!Array.isArray(d.clients)||!Array.isArray(d.projects)||!Array.isArray(d.tasks)||!Array.isArray(d.events)||!Array.isArray(d.approvals))throw Error('Неподходящий файл');if(!confirm('Заменить текущие локальные данные содержимым файла?'))return;var previous=state;state=d;if(!save()){state=previous;return}view.page='overview';view.filter='open';view.expanded={};render();toast('Данные импортированы')}catch(err){alert('Не удалось импортировать JSON проекта: '+err.message)}finally{e.target.value=''}};reader.readAsText(f)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&view.dialog)closeDialog()});
render();
})();
